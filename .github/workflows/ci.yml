name: Python CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Python and Tkinter requirements
        run: |
          sudo apt-get update
          sudo apt-get install -y python3 python3-venv python3-tk xvfb xauth
          python3 -m venv --system-site-packages .buildvenv
          .buildvenv/bin/python -m pip install 'tomli==2.2.1'
      - name: Compile and test
        run: |
          .buildvenv/bin/python -m compileall -q .
          .buildvenv/bin/python -m unittest discover -p 'test_*.py' -q
      - name: Offline mod.io lifecycle self-test
        run: |
          .buildvenv/bin/python unimod.py --modio-self-test | tee modio-self-test.txt
          grep -q '^UNIMOD_MODIO_SELFTEST_OK' modio-self-test.txt
      - name: GUI launch smoke
        run: |
          xvfb-run -a .buildvenv/bin/python unimod.py --smoke-test | tee smoke.txt
          grep -Fx UNIMOD_GUI_SMOKE_OK smoke.txt
      - name: Provider GUI regression smoke
        run: |
          xvfb-run -a .buildvenv/bin/python gui_providers_smoke_v050.py
          xvfb-run -a .buildvenv/bin/python gui_provider_files_smoke_v051.py
          xvfb-run -a .buildvenv/bin/python gui_provider_inbox_smoke_v052.py
          xvfb-run -a .buildvenv/bin/python gui_modio_user_path_smoke_v055.py
          xvfb-run -a .buildvenv/bin/python gui_modio_download_smoke_v055.py
          xvfb-run -a .buildvenv/bin/python gui_modio_managed_smoke_v056.py
          xvfb-run -a .buildvenv/bin/python gui_modio_diagnostic_smoke_v056.py
          xvfb-run -a .buildvenv/bin/python gui_modio_live_probe_smoke_v056.py
          xvfb-run -a .buildvenv/bin/python gui_modio_guide_smoke_v056.py
          xvfb-run -a .buildvenv/bin/python gui_modio_aio_smoke_v056.py
